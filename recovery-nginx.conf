server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    location = /health { default_type application/json; return 200 '{"ok":true,"service":"site-and-brand"}'; }
    location = /brand { return 301 /brand/; }
    location / { try_files $uri $uri/ =404; }
    location ~* \.(?:js|css)$ { add_header Cache-Control "no-cache"; }
    location ~* \.(?:png|jpg|jpeg|webp|svg|ico|woff2|mp4|pdf)$ { expires 1d; }
}

server {
    listen 8080;
    server_name brand.donerclub.kz;
    root /usr/share/nginx/html/brand;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    location = /health { default_type application/json; return 200 '{"ok":true,"service":"brand"}'; }
    location = /brand { return 301 /brand/; }
    # Keep the guide's existing /brand/ asset and navigation URLs working.
    location ^~ /brand/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }
    location / { try_files $uri $uri/ =404; }
    location ~* \.(?:js|css)$ { add_header Cache-Control "no-cache"; }
    location ~* \.(?:png|jpg|jpeg|webp|svg|ico|woff2|mp4|pdf)$ { expires 1d; }
}
