server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    location = /health { default_type application/json; return 200 '{"ok":true,"service":"site-and-brand"}'; }
    location = /brand { return 301 /brand/; }
    location = / {
        if ($host = brand.donerclub.kz) { return 302 /brand/; }
        try_files /index.html =404;
    }
    location / { try_files $uri $uri/ =404; }
    location ~* \.(?:js|css)$ { add_header Cache-Control "no-cache"; }
    location ~* \.(?:png|jpg|jpeg|webp|svg|ico|woff2|mp4|pdf)$ { expires 1d; }
}
